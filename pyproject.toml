[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "judgelab"
version = "0.1.0"
description = "Audit and calibrate LLM-as-judge pipelines: bias, agreement, stability."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "judgelab contributors" }]
keywords = ["llm", "evaluation", "judge", "calibration", "bias", "eval"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0,<3",
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scipy>=1.10,<2",
    "scikit-learn>=1.3,<2",
    "jinja2>=3.1,<4",
    "typer>=0.12,<1",
    "pyyaml>=6.0,<7",
    "rich>=13.0,<15",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
litellm = ["litellm>=1.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
judgelab = "judgelab.cli:app"

[project.urls]
Homepage = "https://github.com/your-org/judgelab"
Issues = "https://github.com/your-org/judgelab/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/judgelab"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
